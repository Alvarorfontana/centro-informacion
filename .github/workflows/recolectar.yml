name: Recolectar noticias

# Dos veces por día (6:00 y 17:00 de Argentina) trae noticias reales de GDELT y de los RSS de datos/fuentes-rss.json
# y las guarda en datos/noticias.json, que es lo que muestra el Centro.
on:
  schedule:
    - cron: '0 9 * * *'    # 6:00 de Argentina
    - cron: '0 20 * * *'   # 17:00 de Argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar
        run: pip install feedparser
      - name: Recolectar
        env:
          PYTHONUNBUFFERED: '1'
          # Tope de tiempo para las búsquedas: lo que no entra se corta y se guarda lo que hay.
          # Cada minuto de más se descuenta del cupo mensual de minutos de GitHub Actions.
          PRESUPUESTO_MINUTOS: '15'
        run: python scripts/recolectar.py
      - name: Urgentes
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/urgentes.py
      - name: Primicias regionales
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/primicias.py
      - name: Guardar
        if: always()
        run: |
          # Firmado como el dueño del repo: Vercel no publica commits de otros autores
          git config user.name "Alvarorfontana"
          git config user.email "alvarorfontana@gmail.com"
          git add datos/noticias.json datos/urgentes.json 2>/dev/null || git add datos/noticias.json
          git add datos/primicias.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Noticias actualizadas"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
